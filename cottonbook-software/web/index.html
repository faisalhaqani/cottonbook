function gridCols(p){
  if(p.plants>1) return Array.from({length:p.plants},(_,i)=>({rep:VIEW.rep,plant:i+1,label:'P'+(i+1)}));
  return Array.from({length:p.reps},(_,i)=>({rep:i+1,plant:1,label:'R'+(i+1)}));
}
function screenRecord(){
  const p=active();
  if(!VIEW.entry||!p.entries.find(e=>e.id===VIEW.entry)) VIEW.entry=p.entries[0].id;
  const e=p.entries.find(x=>x.id===VIEW.entry);
  const cols=gridCols(p);
  const traits=VIEW.tab==='qual'?scopedQual(p):scopedQuant(p);
  const sc=scope(p);
  const ei=p.entries.findIndex(x=>x.id===VIEW.entry);
  let done=0,tot=0;
  for(let r=1;r<=p.reps;r++){const x=repProgress(p,e.id,r);done+=x.done;tot+=x.total;}

  const head=`<tr><th class="sticky-col" style="min-width:230px">Trait</th>
    ${traits.length&&VIEW.tab==='quant'?'':''}
    ${cols.map(c=>`<th class="num" style="min-width:86px;text-align:center">${c.label}</th>`).join('')}
    ${VIEW.tab==='quant'?`<th class="num" style="min-width:84px">Mean</th><th class="num" style="min-width:64px">CV%</th>`:
      `<th class="num" style="min-width:120px">Modal class</th>`}</tr>`;

  const rows=traits.map((t,ri)=>{
    const cells=cols.map((c,ci)=>{
      const cl=cell(p,e.id,c.rep,c.plant);
      if(VIEW.tab==='qual'){
        const v=cl.qual[t.k]??'';
        return `<td class="gcell"><select class="gsel" data-k="${t.k}" data-rep="${c.rep}" data-pl="${c.plant}"
          data-r="${ri}" data-c="${ci}" ${v?'data-set="1"':''}>
          <option value=""></option>
          ${t.o.map((o,i)=>`<option value="${esc(o)}" ${v===o?'selected':''}>${i+1} · ${esc(o)}</option>`).join('')}
        </select></td>`;
      }
      const v=cl.quant[t.k]??'';
      return `<td class="gcell"><input class="ginp" type="text" inputmode="decimal" autocomplete="off"
        data-k="${t.k}" data-rep="${c.rep}" data-pl="${c.plant}" data-max="${t.max||1e9}"
        data-r="${ri}" data-c="${ci}" value="${esc(v)}"></td>`;
    }).join('');
    let tail;
    if(VIEW.tab==='quant'){
      const vals=cols.map(c=>{const v=cell(p,e.id,c.rep,c.plant).quant[t.k];
        return filled(v)&&isFinite(+v)?+v:null;}).filter(v=>v!==null);
      const m=vals.length?S.mean(vals):null;
      const cv=vals.length>1&&m?(S.sd(vals)/m)*100:null;
      tail=`<td class="num gmean">${m===null?'—':fmt(m,t.dp??2)}</td>
            <td class="num gmean" style="${cv!==null&&cv>25?'color:var(--amber)':''}">${cv===null?'—':fmt(cv,1)}</td>`;
    } else {
      const counts={};
      cols.forEach(c=>{const v=cell(p,e.id,c.rep,c.plant).qual[t.k]; if(filled(v))counts[v]=(counts[v]||0)+1;});
      const ks=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
      tail=`<td class="gmean t-meta">${ks.length?esc(ks[0])+' ('+counts[ks[0]]+'/'+cols.length+')':'—'}</td>`;
    }
    const code=codeOf(p,t);
    return `<tr><td class="sticky-col">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span>${esc(t.n)}</span>
        ${code?`<span class="num" style="font-size:11px;color:var(--seed)">${esc(code)}</span>`:''}
        ${t.u?`<span class="t-meta" style="margin-left:auto">${esc(t.u)}</span>`:''}
      </div></td>${cells}${tail}</tr>`;
  }).join('');

  return `<div class="page page-wide">
    <div class="page-head"><div>
      <h1 class="t-title">Record data</h1>
      <p class="t-small" style="margin-top:2px">${esc(e.name)} —
        ${done} of ${tot} values across all replications. Paste a block from Excel into any cell.</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="seg"><button data-act="tab" data-v="quant" aria-pressed="${VIEW.tab==='quant'}">Quantitative · ${sc.M.size}</button>
          <button data-act="tab" data-v="qual" aria-pressed="${VIEW.tab==='qual'}">Qualitative · ${sc.Q.size}</button></div>
        <button class="btn btn-sm" data-act="go" data-screen="traits">${icon('cog',14)}Traits</button></div></div>

    <div class="unitbar" style="margin-top:16px">
      <div class="unit-row">
        <span class="t-meta" style="width:58px">Entry</span>
        <button class="btn btn-sm" data-act="prev-entry" ${ei===0?'disabled':''}>←</button>
        <select class="select" data-act="pick-e" style="width:300px;height:32px">
          ${p.entries.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.code)} — ${esc(x.name)}</option>`).join('')}
        </select>
        <button class="btn btn-sm" data-act="next-entry" ${ei===p.entries.length-1?'disabled':''}>→</button>
        ${p.plants>1?`<span style="width:12px"></span><span class="t-meta">Replication</span>
          ${Array.from({length:p.reps},(_,i)=>{const rp=repProgress(p,e.id,i+1);
            const f=rp.pct>=1?'full':rp.pct>0?'part':'none';
            return `<button class="chip" data-act="pick-r" data-v="${i+1}" aria-pressed="${VIEW.rep===i+1}">
              <span class="ring" data-f="${f}"></span>R${i+1}</button>`;}).join('')}`
         :`<span class="pill pill-plain" style="margin-left:12px">Single plant per replication — all reps shown</span>`}
        <div style="margin-left:auto;display:flex;gap:6px">
          ${p.plants>1&&VIEW.rep>1?`<button class="btn btn-sm" data-act="copy-rep">${icon('copy',14)}Copy R${VIEW.rep-1}</button>`:''}
          <button class="btn btn-sm" data-act="fill-row" title="Fill the row from its first value">Fill across</button>
        </div></div>
    </div>

    <div class="sheet">
      <div class="scroll-x" style="max-height:66vh"><table class="tbl grid">
        <thead>${head}</thead><tbody id="gridbody">${rows}</tbody></table></div>
    </div>
    <div class="plotbar">
      <span class="bar ${done>0&&done<tot?'partial':''}"><i style="width:${tot?Math.round(done/tot*100):0}%"></i></span>
      <span class="num" style="font-size:13px;color:var(--ink-2)">${done}/${tot}</span>
      <span class="t-meta" style="flex:1">Enter moves down · Tab moves right · Ctrl+V pastes a block</span>
      <button class="btn btn-sm" data-act="prev-entry" ${ei===0?'disabled':''}>← Previous entry</button>
      <button class="btn btn-primary" data-act="next-entry" ${ei===p.entries.length-1?'disabled':''}>Next entry →</button>
    </div></div>`;
}

/* grid interaction */
function gridCells(){ return $$('#gridbody .ginp, #gridbody .gsel'); }
function gridAt(r,c){ return $(`#gridbody [data-r="${r}"][data-c="${c}"]`); }
function writeCell(el,val){
  const p=active();
  const cl=cell(p,VIEW.entry,+el.dataset.rep,+el.dataset.pl);
  if(el.classList.contains('gsel')){ 
    if(val==='') delete cl.qual[el.dataset.k]; else cl.qual[el.dataset.k]=val;
    el.value=val; el.toggleAttribute('data-set',!!val);
  } else {
    const clean=String(val).replace(/[^0-9.\-]/g,'');
    if(clean==='') delete cl.quant[el.dataset.k]; else cl.quant[el.dataset.k]=clean;
    el.value=clean;
    const num=parseFloat(clean);
    el.classList.toggle('bad', clean!=='' && (!isFinite(num)||num<0||num>+el.dataset.max));
  }
  p.updated=Date.now();
}
function refreshDerived(){
  const p=active(), cols=gridCols(p);
  const traits=VIEW.tab==='qual'?scopedQual(p):scopedQuant(p);
  $$('#gridbody tr').forEach((tr,ri)=>{
    const t=traits[ri]; if(!t)return;
    const outs=tr.querySelectorAll('.gmean');
    if(VIEW.tab==='quant'){
      const vals=cols.map(c=>{const v=cell(p,VIEW.entry,c.rep,c.plant).quant[t.k];
        return filled(v)&&isFinite(+v)?+v:null;}).filter(v=>v!==null);
      const m=vals.length?S.mean(vals):null;
      const cv=vals.length>1&&m?(S.sd(vals)/m)*100:null;
      if(outs[0])outs[0].textContent=m===null?'—':fmt(m,t.dp??2);
      if(outs[1]){outs[1].textContent=cv===null?'—':fmt(cv,1);
        outs[1].style.color=(cv!==null&&cv>25)?'var(--amber)':'';}
    } else {
      const counts={};
      cols.forEach(c=>{const v=cell(p,VIEW.entry,c.rep,c.plant).qual[t.k]; if(filled(v))counts[v]=(counts[v]||0)+1;});
      const ks=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
      if(outs[0])outs[0].textContent=ks.length?`${ks[0]} (${counts[ks[0]]}/${cols.length})`:'—';
    }
  });
  const bar=$('.plotbar .bar>i'), lab=$('.plotbar .num');
  if(bar){ const p2=active(); let d=0,t=0;
    for(let r=1;r<=p2.reps;r++){const x=repProgress(p2,VIEW.entry,r);d+=x.done;t+=x.total;}
    bar.style.width=(t?Math.round(d/t*100):0)+'%'; if(lab)lab.textContent=`${d}/${t}`;
  }
}
function pasteBlock(el,text){
  const rows=text.replace(/\r/g,'').split('\n').filter((l,i,a)=>l!==''||i<a.length-1);
  const r0=+el.dataset.r, c0=+el.dataset.c;
  rows.forEach((line,dr)=>{
    line.split('\t').forEach((val,dc)=>{
      const target=gridAt(r0+dr,c0+dc);
      if(target) writeCell(target, val.trim());
    });
  });
  persist(); refreshDerived();
  toast(`Pasted ${rows.length} × ${rows[0].split('\t').length}`);
}

function renderTraitsScreen(){ render(); }

<script>

/* ============================================================
   ANALYSIS CATALOGUE
   ============================================================ */
const PROCS=[
  {id:'A1', g:'Quantitative', n:'Descriptive statistics', d:'n, min, max, range, mean ± SE, SD, CV%, skewness, kurtosis'},
  {id:'A2', g:'Quantitative', n:'ANOVA, CV%, LSD, h²', d:'Mean squares, F, p, significance, LSD 5% and 1%'},
  {id:'A3', g:'Quantitative', n:'Entry means with LSD letters', d:'Ranked means, grouping letters, footer LSD and CV'},
  {id:'A4', g:'Quantitative', n:'Pearson correlation', d:'r and p matrices, plus the significant pairs list'},
  {id:'A5', g:'Quantitative', n:'Principal component analysis', d:'Eigenvalues, loadings, scores, scree and biplot'},
  {id:'A6', g:'Quantitative', n:'Variance components', d:'σ²g, σ²e, σ²p, GCV%, PCV%, h²b, GA, GAM'},
  {id:'A6b',g:'Quantitative', n:'Genotypic / phenotypic / environmental correlation', d:'From the covariance analysis'},
  {id:'A6c',g:'Quantitative', n:'Path coefficient analysis', d:'Direct and indirect effects on a chosen trait'},
  {id:'A7', g:'Quantitative', n:'Distance and clustering', d:'Euclidean distance, UPGMA dendrogram, Ward on PCA'},
  {id:'A8', g:'Quantitative', n:'Within-plot uniformity', d:'Plant-to-plant variation inside each plot', needPlants:true},
  {id:'B1', g:'Qualitative',  n:'Descriptor frequency', d:'Modal class, modal %, classes, within-line H′'},
  {id:'B2', g:'Qualitative',  n:'Shannon diversity and Cramér′s V', d:'H′, H′max, ratio, chi-square, V'},
  {id:'B2b',g:'Qualitative',  n:'Line uniformity ranking', d:'Mean within-line H′, descriptors fixed, off-type %'},
  {id:'B3', g:'Qualitative',  n:'Multiple correspondence analysis', d:'Benzécri-adjusted inertia, scores, categories'},
  {id:'B4', g:'Qualitative',  n:'Qualitative distance and clusters', d:'Distance on descriptor states, UPGMA cuts'},
  {id:'B5', g:'Qualitative',  n:'Descriptor × descriptor association', d:'Pearson on line scores, Cramér′s V matrix'},
  {id:'B6', g:'Qualitative',  n:'Qualitative × quantitative correlation', d:'Descriptor score against trait means'},
  {id:'C1', g:'Combined',     n:'Mantel test and cluster concordance', d:'Agreement between the two data types'},
  {id:'D1', g:'Mating design',n:'Line × Tester analysis', d:'ANOVA, GCA, SCA, σ²A, σ²D, narrow-sense h²', needLT:true}
];

/* helpers shared by analysis + export */
function entryMeansMatrix(p,traits){
  return p.entries.map(e=>traits.map(t=>entryMean(p,e.id,t.k)));
}
function completeTraitSet(p,traits){
  return traits.filter(t=>p.entries.every(e=>entryMean(p,e.id,t.k)!==null));
}
function qualOrdinalMeans(p,quals){
  // mean of the 1..k category code over all plants of an entry
  return p.entries.map(e=>quals.map(t=>{
    const codes=[];
    for(let r=1;r<=p.reps;r++)for(let pl=1;pl<=p.plants;pl++){
      const v=cell(p,e.id,r,pl).qual[t.k];
      if(filled(v)){const i=t.o.indexOf(v); if(i>=0)codes.push(i+1);}
    }
    return codes.length?S.mean(codes):null;
  }));
}
const tbl=(sheet,title,cols,rows,note)=>({sheet,title,cols,rows,note});

/* ============================================================
   RUN
   ============================================================ */
function runAnalysis(p,sel,dep){
  const out={sections:[],figures:[],meta:{}};
  const design=p.design==='LT'?'RCBD':p.design;
  const traits=analysableQuant(p);
  const quals=analysableQual(p).filter(t=>new Set(qualRecords(p,t.k).map(x=>x.v)).size>1);
  const mono=analysableQual(p).filter(t=>new Set(qualRecords(p,t.k).map(x=>x.v)).size<=1);
  const E=p.entries, lab=E.map(e=>e.code+' '+e.name);
  const an={}; traits.forEach(t=>{const a=S.anova(obs(p,t.k),design); if(a&&!a.insufficient)an[t.k]=a;});
  const anTraits=traits.filter(t=>an[t.k]);
  out.meta={traits:traits.length,quals:quals.length,mono:mono.map(t=>t.n),entries:E.length};

  const L=t=>labelOf(p,t);

  /* ---------- A1 ---------- */
  if(sel.has('A1')){
    const rows=traits.map(t=>{
      const vals=E.map(e=>entryMean(p,e.id,t.k)).filter(v=>v!==null);
      const d=S.describe(vals);
      return [t.n,codeOf(p,t),groupOf(p,t),d.n,fmt(d.min,3),fmt(d.max,3),fmt(d.range,3),
        `${fmt(d.mean,2)} ± ${fmt(d.se,2)}`,fmt(d.sd,3),fmt(d.cv,2),fmt(d.skew,3),fmt(d.kurt,3)];
    });
    out.sections.push({id:'A1',title:'Descriptive statistics',
      note:`Computed on entry means (n = ${E.length}).`,
      tables:[tbl('A1_Descriptive','Descriptive statistics',
        ['Trait','Code','Group','n','Minimum','Maximum','Range','Mean ± SE','SD','CV%','Skewness','Kurtosis'],rows)]});
  }

  /* ---------- A2 ---------- */
  if(sel.has('A2')){
    const rows=anTraits.map(t=>{const a=an[t.k];
      return [t.n,codeOf(p,t),groupOf(p,t),fmt(a.grand,3),
        a.MSblk!==null?fmt(a.MSblk,4):'—',fmt(a.MStrt,4),fmt(a.MSerr,4),
        fmt(a.Ftrt,2),pStr(a.pTrt),stars(a.pTrt),sigWord(a.pTrt),
        a.Fblk!==null?fmt(a.Fblk,2):'—',a.pBlk!==null?pStr(a.pBlk):'—',
        a.pBlk!==null?stars(a.pBlk):'—',a.pBlk!==null?sigWord(a.pBlk):'—',
        fmt(a.cv,2),fmt(a.lsd05,3),fmt(a.lsd01,3),fmt(a.h2,3)];});
    out.sections.push({id:'A2',title:'Analysis of variance',
      note:`${DESIGN_NAME[p.design]} model on plot means. ** significant at 1%, * significant at 5%, ns not significant.`,
      tables:[tbl('A2_ANOVA_CV_LSD','ANOVA, CV% and LSD',
        ['Trait','Code','Group','Grand mean','MS replication','MS genotype','MS error','F genotype','p','Sig.',
         'Significance','F replication','p (rep)','Sig. (rep)','Significance (rep)','CV%','LSD 5%','LSD 1%','h2 broad'],rows)]});
  }

  /* ---------- A3 ---------- */
  if(sel.has('A3')&&anTraits.length){
    const cols=['Entry',...anTraits.map(L)];
    const rows=E.map(e=>[e.name,...anTraits.map(t=>{
      const m=an[t.k].means.find(x=>x.g===e.id);
      return m?`${fmt(m.mean,2)} ${m.letters}`:'—';})]);
    rows.push(['Mean',...anTraits.map(t=>fmt(an[t.k].grand,2))]);
    rows.push(['LSD (5%)',...anTraits.map(t=>fmt(an[t.k].lsd05,3))]);
    rows.push(['LSD (1%)',...anTraits.map(t=>fmt(an[t.k].lsd01,3))]);
    rows.push(['CV (%)',...anTraits.map(t=>fmt(an[t.k].cv,2))]);
    rows.push(['Sig.',...anTraits.map(t=>stars(an[t.k].pTrt))]);
    rows.push(['Significance',...anTraits.map(t=>sigWord(an[t.k].pTrt))]);
    out.sections.push({id:'A3',title:'Entry means with LSD grouping',
      note:'Means not sharing a letter differ at the 5% level.',
      tables:[tbl('A3_Means_LSD','Means with LSD letters',cols,rows)]});
  }

  /* ---------- A4 ---------- */
  if(sel.has('A4')&&traits.length>1){
    const M=entryMeansMatrix(p,traits);
    const k=traits.length, R=[],P=[];
    for(let i=0;i<k;i++){R[i]=[];P[i]=[];}
    const pairs=[];
    for(let i=0;i<k;i++)for(let j=0;j<k;j++){
      if(i===j){R[i][j]=1;P[i][j]=0;continue;}
      const a=[],b=[];
      M.forEach(row=>{if(row[i]!==null&&row[j]!==null){a.push(row[i]);b.push(row[j]);}});
      const c=a.length>=3?S.pearson(a,b):null;
      R[i][j]=c?c.r:null; P[i][j]=c?c.p:null;
      if(c&&i<j&&c.p<0.05) pairs.push([traits[i].n,traits[j].n,fmt(c.r,3),pStr(c.p),stars(c.p),
        (groupOf(p,traits[i])||'—')+' × '+(groupOf(p,traits[j])||'—')]);
    }
    pairs.sort((x,y)=>Math.abs(+y[2])-Math.abs(+x[2]));
    const names=traits.map(L);
    const tri=names.map((n,i)=>[n,...names.map((_,j)=>j>i?'':
      (R[i][j]===null?'—':fmt(R[i][j],3)+(i===j?'':stars(P[i][j])==='ns'?'':stars(P[i][j]))))]);
    out.sections.push({id:'A4',title:'Pearson correlation',
      note:`On entry means, n = ${E.length}, df = ${E.length-2}. ${pairs.length} pairs significant at 5%.`,
      heat:{names,R},
      tables:[
        tbl('A4_Correlation','Correlation (lower triangle, with significance)',['index',...names],tri),
        tbl('A4_Corr_r','Correlation coefficients',['index',...names],
          names.map((n,i)=>[n,...R[i].map(v=>v===null?'':fmt(v,4))])),
        tbl('A4_Corr_p','Correlation p values',['index',...names],
          names.map((n,i)=>[n,...P[i].map(v=>v===null?'':fmt(v,5))])),
        tbl('A4_Significant_pairs','Significant pairs',
          ['Trait 1','Trait 2','r','p','Sig.','Type'],pairs)]});
  }

  /* ---------- A5 ---------- */
  let pcaRes=null, pcTraits=[];
  if(sel.has('A5')||sel.has('A7')||sel.has('C1')){
    pcTraits=completeTraitSet(p,traits);
    if(pcTraits.length>=2&&E.length>=3)
      pcaRes=S.pca(entryMeansMatrix(p,pcTraits),E.map(e=>e.code),pcTraits.map(L));
  }
  if(sel.has('A5')){
    if(!pcaRes){
      out.sections.push({id:'A5',title:'Principal component analysis',
        note:'Needs at least three entries with complete means for two or more traits.',tables:[]});
    } else {
      const nd=Math.min(5,pcaRes.comps.length);
      const dims=Array.from({length:nd},(_,i)=>'PC'+(i+1));
      out.sections.push({id:'A5',title:'Principal component analysis',
        note:`${pcTraits.length} traits with complete means across ${E.length} entries.`,
        figures:['scree','biplot'],
        tables:[
          tbl('A5_PCA_Eigenvalues','Eigenvalues',['Principal component','Eigenvalue','Variance explained (%)','Cumulative variance (%)'],
            pcaRes.comps.slice(0,10).map(c=>['PC'+c.pc,fmt(c.eigen,4),fmt(c.pct,2),fmt(c.cum,2)])),
          tbl('A5_PCA_Loadings','Loadings',['index',...dims],
            pcaRes.loadings.map((l,i)=>[pcTraits[i].n,...dims.map(d=>fmt(l[d],3))])),
          tbl('A5_PCA_Scores','Scores',['index',...dims],
            pcaRes.scores.map((s,i)=>[E[i].name,...dims.map(d=>fmt(s[d],3))]))]});
      out.pca={res:pcaRes,traits:pcTraits};
    }
  }

  /* ---------- A6 variance components ---------- */
  if(sel.has('A6')){
    const rows=anTraits.map(t=>{const a=an[t.k];
      return [t.n,codeOf(p,t),fmt(a.grand,3),fmt(a.vg,4),fmt(a.ve,4),fmt(a.vp,4),
        fmt(a.gcv,2),fmt(a.pcv,2),fmt(a.h2,3),fmt(a.h2*100,1),fmt(a.ga,3),fmt(a.gam,2)];});
    out.sections.push({id:'A6',title:'Variance components and genetic parameters',
      note:'σ²g = (MSg − MSe)/r, σ²e = MSe, σ²p = σ²g + σ²e. GA uses k = 2.06 at 5% selection. Negative components are set to zero.',
      tables:[tbl('A6_Variance_Components','Variance components',
        ['Trait','Code','Mean','σ²g','σ²e','σ²p','GCV%','PCV%','h² broad','h² (%)','GA','GAM%'],rows)]});
  }

  /* ---------- A6b genetic correlations ---------- */
  if(sel.has('A6b')&&anTraits.length>1){
    const gc=S.geneticCorrelations(anTraits.map(t=>({key:t.k,rows:obs(p,t.k)})),design);
    const names=anTraits.map(L);
    const mk=(M,sheet,title)=>tbl(sheet,title,['index',...names],
      names.map((n,i)=>[n,...M[i].map(v=>v===null?'':fmt(v,3))]));
    out.sections.push({id:'A6b',title:'Genotypic, phenotypic and environmental correlation',
      note:'From the analysis of covariance. Genotypic values can exceed ±1 when variance components are small; they are shown as computed.',
      tables:[mk(gc.rg,'A6_Genotypic_corr','Genotypic correlation (rg)'),
              mk(gc.rp,'A6_Phenotypic_corr','Phenotypic correlation (rp)'),
              mk(gc.re,'A6_Environmental_corr','Environmental correlation (re)')]});
  }

  /* ---------- A6c path ---------- */
  if(sel.has('A6c')){
    const depT=traits.find(t=>t.k===dep)||traits[traits.length-1];
    let ind=completeTraitSet(p,traits).filter(t=>t.k!==(depT&&depT.k));
    // a path analysis cannot invert a singular matrix, so drop near-duplicates first
    const dropped=[];
    {
      const kept=[];
      ind.forEach(t=>{
        const a=p.entries.map(e=>entryMean(p,e.id,t.k));
        const clash=kept.find(u=>{
          const b=p.entries.map(e=>entryMean(p,e.id,u.k));
          const c=S.pearson(a,b); return c&&Math.abs(c.r)>=0.98;
        });
        if(clash) dropped.push(t.n+' (duplicates '+clash.n+')'); else kept.push(t);
      });
      ind=kept;
      // the correlation matrix can only be inverted when entries exceed traits:
      // rank is at most n-1, so keep the strongest predictors of the dependent trait
      const limit=Math.max(2,p.entries.length-2);
      if(ind.length>limit){
        const yv=p.entries.map(e=>entryMean(p,e.id,depT.k));
        const scored=ind.map(t=>{
          const c=S.pearson(p.entries.map(e=>entryMean(p,e.id,t.k)),yv);
          return {t,r:c?Math.abs(c.r):0};
        }).sort((x,y)=>y.r-x.r);
        scored.slice(limit).forEach(x=>dropped.push(x.t.n+' (beyond the '+limit+'-trait limit)'));
        ind=scored.slice(0,limit).map(x=>x.t);
      }
    }
    if(!depT||ind.length<2){
      out.sections.push({id:'A6c',title:'Path coefficient analysis',
        note:'Needs a dependent trait and at least two independent traits with complete means.',tables:[]});
    } else {
      const M=entryMeansMatrix(p,ind), y=E.map(e=>entryMean(p,e.id,depT.k));
      const k=ind.length, R=[];
      for(let i=0;i<k;i++){R[i]=[];for(let j=0;j<k;j++){
        if(i===j){R[i][j]=1;continue;}
        const c=S.pearson(M.map(r=>r[i]),M.map(r=>r[j])); R[i][j]=c?c.r:0;}}
      const rY=ind.map((_,i)=>{const c=S.pearson(M.map(r=>r[i]),y);return c?c.r:0;});
      const pa=S.path(R,rY,ind.map(L));
      if(!pa){ out.sections.push({id:'A6c',title:'Path coefficient analysis',
        note:`The correlation matrix could not be inverted. With ${p.entries.length} entries a path analysis can carry at most ${Math.max(2,p.entries.length-2)} independent traits, and those traits must not be collinear.`,tables:[]}); }
      else{
        const rows=ind.map((t,i)=>[t.n,fmt(pa.direct[i],4),
          ...ind.map((_,j)=>i===j?'(direct)':fmt(pa.indirect[i][j],4)),fmt(rY[i],3)]);
        out.sections.push({id:'A6c',title:'Path coefficient analysis',
          note:`Dependent trait: ${depT.n}. Residual effect ${fmt(pa.residual,4)}, R² ${fmt(pa.R2,4)}.`
            +(dropped.length?` Dropped for collinearity: ${dropped.join(', ')}.`:''),
          figures:['path'],
          tables:[tbl('A6_Path_Analysis','Direct and indirect effects',
            ['Trait','Direct effect',...ind.map(t=>'via '+L(t)),'Correlation with '+(codeOf(p,depT)||depT.n)],rows)]});
        out.path={pa,dep:depT,ind};
      }
    }
  }

  /* ---------- A7 distance + clusters ---------- */
  let Dq=null, cutQ=null;
  if(sel.has('A7')||sel.has('C1')){
    const ts=pcTraits.length?pcTraits:completeTraitSet(p,traits);
    if(ts.length>=2&&E.length>=3){
      const Z=S.standardise(entryMeansMatrix(p,ts));
      Dq=S.euclidean(Z);
      const cl=S.cluster(Dq,lab,'upgma');
      cutQ=cl.cut(Math.min(4,E.length-1));
      const ward=pcaRes?S.cluster(S.euclidean(pcaRes.scores.map(s=>
        Array.from({length:Math.min(5,pcaRes.comps.length)},(_,i)=>s['PC'+(i+1)]||0))),lab,'ward'):null;
      if(sel.has('A7')){
        const names=E.map(e=>e.name);
        out.sections.push({id:'A7',title:'Genetic distance and clustering',
          note:`Euclidean distance on standardised means of ${ts.length} traits. UPGMA grouping, with Ward clustering on the PCA scores for comparison.`,
          figures:['dendroQ'],
          tables:[
            tbl('A7_Distance','Euclidean distance matrix',['Entry',...names],
              names.map((n,i)=>[n,...Dq[i].map(v=>fmt(v,3))])),
            tbl('A7_Clusters','Cluster membership',
              ['Entry','Cluster (k=2)','Cluster (k=3)','Cluster (k=4)','Cluster (k=5)','PCA-Ward group'],
              names.map((n,i)=>[n,cl.cut(2)[i],cl.cut(3)[i],cl.cut(4)[i],cl.cut(5)[i],
                ward?ward.cut(Math.min(4,E.length-1))[i]:'—']))]});
        out.dendroQ={cl,labels:E.map(e=>e.code)};
      }
      out.clQ={cl,ward};
    }
  }

  /* ---------- A8 within-plot uniformity ---------- */
  if(sel.has('A8')&&p.plants>1){
    const rows=traits.map(t=>{
      let within=[],plots=0;
      E.forEach(e=>{for(let r=1;r<=p.reps;r++){
        const v=plotValues(p,e.id,r,t.k);
        if(v.length>1){within.push(S.sd(v)); plots++;}
      }});
      const gm=S.mean(E.map(e=>entryMean(p,e.id,t.k)).filter(x=>x!==null));
      const msd=within.length?S.mean(within):null;
      return [t.n,codeOf(p,t),plots,msd===null?'—':fmt(msd,3),
        msd===null||!gm?'—':fmt(msd/gm*100,2)];
    });
    out.sections.push({id:'A8',title:'Within-plot uniformity',
      note:`Plant-to-plant variation inside each plot, averaged over ${E.length*p.reps} plots.`,
      tables:[tbl('A8_Within_Plot','Within-plot uniformity',
        ['Trait','Code','Plots with ≥2 plants','Mean within-plot SD','Within-plot CV%'],rows)]});
  }

  /* ---------- qualitative core ---------- */
  const qualStats=(t)=>{
    const byEntry=E.map(e=>{
      const counts={};
      for(let r=1;r<=p.reps;r++)for(let pl=1;pl<=p.plants;pl++){
        const v=cell(p,e.id,r,pl).qual[t.k]; if(filled(v))counts[v]=(counts[v]||0)+1;
      }
      const tot=S.sum(Object.values(counts));
      const ks=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
      return {e,counts,tot,modal:ks[0]||'',modalN:counts[ks[0]]||0,
        classes:ks.length,H:S.shannon(Object.values(counts)),
        freq:ks.map(k=>`${k}: ${counts[k]}`).join('; ')};
    });
    const states=[...new Set(qualRecords(p,t.k).map(x=>x.v))].sort();
    const table=byEntry.map(b=>states.map(s=>b.counts[s]||0));
    const cv=S.cramersV(table);
    const all={}; qualRecords(p,t.k).forEach(x=>all[x.v]=(all[x.v]||0)+1);
    const H=S.shannon(Object.values(all)), Hmax=Math.log(states.length||1);
    return {byEntry,states,cv,H,Hmax,ratio:Hmax?H/Hmax:0,
      meanWithin:S.mean(byEntry.map(b=>b.H)),fixed:byEntry.filter(b=>b.classes===1).length};
  };
  const QS={}; if(sel.has('B1')||sel.has('B2')||sel.has('B2b')) quals.forEach(t=>QS[t.k]=qualStats(t));

  if(sel.has('B1')){
    const rows=[];
    quals.forEach(t=>QS[t.k].byEntry.forEach(b=>rows.push([t.n,b.e.name,b.modal,
      `${b.modalN} / ${b.tot}`,fmt(b.tot?b.modalN/b.tot*100:0,2),b.classes,b.freq,fmt(b.H,3)])));
    out.sections.push({id:'B1',title:'Descriptor frequency by entry',
      note:`${quals.length} polymorphic descriptors${mono.length?`; ${mono.length} monomorphic and excluded`:''}.`,
      tables:[tbl('B1_Qual_Frequency','Frequency and modal class',
        ['Trait','Line','Modal class','Modal count','Modal %','No. of classes','Frequency distribution','Within-line H′'],rows)]});
  }
  if(sel.has('B2')){
    const rows=quals.map(t=>{const q=QS[t.k];
      const cls=q.ratio>=0.7?'High':q.ratio>=0.4?'Moderate':'Low';
      return [t.n,q.states.length,fmt(q.H,3),fmt(q.Hmax,3),fmt(q.ratio,3),cls,
        fmt(q.cv.chi2,1),fmt(q.cv.v,3),stars(q.cv.p),sigWord(q.cv.p),fmt(q.meanWithin,3),q.fixed];})
      .sort((a,b)=>+b[2]-+a[2]);
    out.sections.push({id:'B2',title:'Shannon diversity and descriptor association',
      note:'H′ on pooled plant records. Chi-square and Cramér′s V test the entry × class table.',
      figures:['shannon'],
      tables:[tbl('B2_Shannon','Shannon diversity',
        ['Trait','k','H′','H′max','H′/H′max','Diversity class','Chi-square',"Cramér's V",'Sig.','Significance','Mean within-line H′','Lines fixed'],rows)]});
    out.shannon=rows;
  }
  if(sel.has('B2b')){
    const perEntry=E.map((e,i)=>{
      const Hs=quals.map(t=>QS[t.k]?QS[t.k].byEntry[i]:null).filter(Boolean);
      const fixed=Hs.filter(b=>b.classes===1).length;
      const modal=Hs.length?S.mean(Hs.map(b=>b.tot?b.modalN/b.tot*100:0)):0;
      return {e,mean:Hs.length?S.mean(Hs.map(b=>b.H)):0,fixed,modal};
    }).sort((a,b)=>a.mean-b.mean);
    out.sections.push({id:'B2b',title:'Line uniformity ranking',
      note:'Lower mean within-line H′ means a more uniform line.',
      figures:['uniformity'],
      tables:[tbl('B2_Uniformity','Uniformity ranking',
        ['Rank','Line','Mean within-line H′','Descriptors fixed','Mean modal %','Mean off-type %'],
        perEntry.map((x,i)=>[i+1,x.e.name,fmt(x.mean,3),x.fixed,fmt(x.modal,1),fmt(100-x.modal,1)]))]});
    out.uniformity=perEntry;
  }
  if(sel.has('B3')){
    const rowsIn=[], owner=[];
    E.forEach((e,ei)=>{for(let r=1;r<=p.reps;r++)for(let pl=1;pl<=p.plants;pl++){
      const rec=quals.map(t=>cell(p,e.id,r,pl).qual[t.k]);
      if(rec.every(filled)){rowsIn.push(rec);owner.push(ei);}
    }});
    const m=quals.length>=2&&rowsIn.length>=5?S.mca(rowsIn,quals.map(t=>t.n)):null;
    if(!m){ out.sections.push({id:'B3',title:'Multiple correspondence analysis',
      note:'Needs at least two polymorphic descriptors scored on five or more complete plants.',tables:[]}); }
    else{
      const nd=m.nd, dims=Array.from({length:nd},(_,i)=>'Dim'+(i+1));
      const centro=E.map((e,ei)=>{
        const rows=m.rowCoords.filter((_,i)=>owner[i]===ei);
        const o={name:e.name,code:e.code};
        dims.forEach(d=>o[d]=rows.length?S.mean(rows.map(r=>r[d])):0);
        return o;});
      out.sections.push({id:'B3',title:'Multiple correspondence analysis',
        note:`${rowsIn.length} complete plant records over ${quals.length} descriptors. Inertia is Benzécri adjusted.`,
        figures:['mca'],
        tables:[
          tbl('B3_MCA_Eigenvalues','Eigenvalues',
            ['Dimension','Raw eigenvalue','Raw inertia (%)','Benzécri-adjusted (%)','Cumulative adjusted (%)'],
            m.comps.map(c=>[c.dim,fmt(c.eigen,4),fmt(c.rawPct,2),fmt(c.adjPct,2),fmt(c.cumAdj,2)])),
          tbl('B3_MCA_Scores','Entry scores',['Line',...dims],
            centro.map(c=>[c.name,...dims.map(d=>fmt(c[d],3))])),
          tbl('B3_MCA_Categories','Category coordinates',
            ['Trait','State',...dims,'Contrib Dim1 (%)','Contrib Dim2 (%)'],
            m.catCoords.map(c=>[c.trait,c.state,...dims.map(d=>fmt(c[d],3)),
              fmt(c.contrib1,2),fmt(c.contrib2??0,2)]))]});
      out.mca={m,centro};
    }
  }
  let Dql=null,cutL=null;
  if((sel.has('B4')||sel.has('C1'))&&quals.length>=2){
    const OM=qualOrdinalMeans(p,quals).map(r=>r.map(v=>v===null?0:v));
    Dql=S.euclidean(OM);
    const cl=S.cluster(Dql,lab,'upgma');
    cutL=cl.cut(Math.min(4,E.length-1));
    if(sel.has('B4')){
      const names=E.map(e=>e.name);
      out.sections.push({id:'B4',title:'Qualitative distance and clustering',
        note:`Euclidean distance on mean descriptor state scores over ${quals.length} descriptors.`,
        figures:['dendroL'],
        tables:[
          tbl('B4_Qual_Distance','Qualitative distance matrix',['Entry',...names],
            names.map((n,i)=>[n,...Dql[i].map(v=>fmt(v,3))])),
          tbl('B4_Qual_Clusters','Cluster membership',
            ['Entry','Cluster (k=2)','Cluster (k=3)','Cluster (k=4)','Cluster (k=5)'],
            names.map((n,i)=>[n,cl.cut(2)[i],cl.cut(3)[i],cl.cut(4)[i],cl.cut(5)[i]]))]});
      out.dendroL={cl,labels:E.map(e=>e.code)};
    }
  }
  if(sel.has('B5')&&quals.length>1){
    const OM=qualOrdinalMeans(p,quals);
    const k=quals.length, R=[],P=[],V=[];
    for(let i=0;i<k;i++){R[i]=[];P[i]=[];V[i]=[];}
    const sig=[];
    for(let i=0;i<k;i++)for(let j=0;j<k;j++){
      if(i===j){R[i][j]=1;P[i][j]=0;V[i][j]=1;continue;}
      const a=[],b=[];
      OM.forEach(row=>{if(row[i]!==null&&row[j]!==null){a.push(row[i]);b.push(row[j]);}});
      const c=a.length>=3?S.pearson(a,b):null;
      R[i][j]=c?c.r:null; P[i][j]=c?c.p:null;
      if(c&&i<j&&c.p<0.05) sig.push([quals[i].n,quals[j].n,fmt(c.r,3),pStr(c.p),stars(c.p),sigWord(c.p)]);
      // Cramér's V on plant level
      const recI=qualRecords(p,quals[i].k), recJ=qualRecords(p,quals[j].k);
      const key=x=>x.entry.id+'|'+x.rep+'|'+x.plant;
      const mj={}; recJ.forEach(x=>mj[key(x)]=x.v);
      const si=[...new Set(recI.map(x=>x.v))].sort(), sj=[...new Set(recJ.map(x=>x.v))].sort();
      const T=si.map(()=>sj.map(()=>0));
      recI.forEach(x=>{const o=mj[key(x)]; if(o!==undefined)T[si.indexOf(x.v)][sj.indexOf(o)]++;});
      const cv=S.cramersV(T); V[i][j]=cv?cv.v:null;
    }
    sig.sort((x,y)=>Math.abs(+y[2])-Math.abs(+x[2]));
    const names=quals.map(t=>t.n);
    out.sections.push({id:'B5',title:'Descriptor × descriptor association',
      note:'Pearson on mean state scores per entry, and Cramér′s V on the plant-level contingency tables.',
      tables:[
        tbl('B5_QualQual_Pearson','Correlation (lower triangle)',['index',...names],
          names.map((n,i)=>[n,...names.map((_,j)=>j>i?'':
            (R[i][j]===null?'—':fmt(R[i][j],3)+(i===j?'':stars(P[i][j])==='ns'?'':stars(P[i][j]))))])),
        tbl('B5_QualQual_sig','Significant descriptor pairs',
          ['Descriptor 1','Descriptor 2','r','p','Sig.','Significance'],sig),
        tbl('B5_QualQual_CramersV',"Cramér's V",['index',...names],
          names.map((n,i)=>[n,...V[i].map(v=>v===null?'':fmt(v,3))]))]});
  }
  if(sel.has('B6')&&quals.length&&traits.length){
    const OM=qualOrdinalMeans(p,quals);
    const long=[], matrix=[];
    quals.forEach((q,qi)=>{
      const row=[q.n];
      traits.forEach((t,ti)=>{
        const a=[],b=[];
        E.forEach((e,ei)=>{const x=OM[ei][qi], y=entryMean(p,e.id,t.k);
          if(x!==null&&y!==null){a.push(x);b.push(y);}});
        const c=a.length>=3?S.pearson(a,b):null;
        long.push([q.n,t.n,codeOf(p,t),c?fmt(c.r,3):'—',c?pStr(c.p):'—',c?stars(c.p):'—',c?sigWord(c.p):'—']);
        row.push(c?fmt(c.r,3):'');
      });
      matrix.push(row);
    });
    out.sections.push({id:'B6',title:'Qualitative × quantitative correlation',
      note:'Descriptor state score against trait means, across entries.',
      tables:[
        tbl('B6_QualQuant_corr','Pairwise correlation',
          ['Qualitative descriptor','Quantitative trait','Code','r','p','Sig.','Significance'],long),
        tbl('B6_QualQuant_matrix','Correlation matrix',
          ['Qualitative descriptor',...traits.map(L)],matrix)]});
  }

  /* ---------- C1 ---------- */
  if(sel.has('C1')){
    if(!Dq||!Dql){
      out.sections.push({id:'C1',title:'Mantel test and cluster concordance',
        note:'Needs both a quantitative and a qualitative distance matrix. Run the A7 and B4 procedures together.',tables:[]});
    } else {
      const mt=S.mantel(Dq,Dql,999);
      const agree=S.clusterAgreement(cutQ,cutL);
      const wardCut=out.clQ&&out.clQ.ward?out.clQ.ward.cut(Math.min(4,E.length-1)):null;
      out.sections.push({id:'C1',title:'Mantel test and cluster concordance',
        note:'Permutation test between the two distance matrices.',
        tables:[
          tbl('C1_Mantel','Mantel test',['Statistic','Value'],[
            ['Mantel r',fmt(mt.r,4)],
            [`two-tailed p (${mt.perms} permutations)`,fmt(mt.p,4)],
            ['Significance',sigWord(mt.p)],
            ['shared variance (%)',fmt(mt.shared,1)],
            ['UPGMA quantitative vs qualitative agreement (%)',fmt(agree,1)],
            ['PCA-Ward vs qualitative agreement (%)',wardCut?fmt(S.clusterAgreement(wardCut,cutL),1):'—']]),
          tbl('C1_Concordance','Cluster concordance',
            ['Entry','UPGMA quantitative','PCA-Ward quantitative','UPGMA qualitative'],
            E.map((e,i)=>[e.name,cutQ[i],wardCut?wardCut[i]:'—',cutL[i]]))]});
    }
  }

  /* ---------- D1 Line x Tester ---------- */
  if(sel.has('D1')&&p.design==='LT'){
    const ts=anTraits;
    const anovaRows=[],gcaL=[],gcaT=[],scaRows=[],varRows=[];
    ts.forEach(t=>{
      const recs=[];
      p.entries.filter(e=>e.type==='cross').forEach(e=>{
        for(let r=1;r<=p.reps;r++){const m=plotMean(p,e.id,r,t.k);
          if(m!==null)recs.push({line:e.line,tester:e.tester,r,y:m});}
      });
      const lt=S.lineTester(recs,design);
      if(!lt)return;
      lt.table.forEach(row=>anovaRows.push([t.n,row.src,row.df,fmt(row.ss,4),
        row.ms!==undefined?fmt(row.ms,4):'',row.F!==undefined&&row.F!==null?fmt(row.F,2):'',
        row.p!==undefined?pStr(row.p):'',row.p!==undefined?stars(row.p):'',row.p!==undefined?sigWord(row.p):'']));
      lt.gcaLines.forEach(g=>gcaL.push([t.n,g.name,fmt(g.effect,4),fmt(g.se,4),
        fmt(Math.abs(g.effect/g.se),2),stars(S.pT(Math.abs(g.effect/g.se),lt.dfErr))]));
      lt.gcaTesters.forEach(g=>gcaT.push([t.n,g.name,fmt(g.effect,4),fmt(g.se,4),
        fmt(Math.abs(g.effect/g.se),2),stars(S.pT(Math.abs(g.effect/g.se),lt.dfErr))]));
      lt.sca.forEach(s2=>scaRows.push([t.n,s2.line,s2.tester,fmt(s2.mean,3),fmt(s2.effect,4),fmt(s2.se,4),
        stars(S.pT(Math.abs(s2.effect/s2.se),lt.dfErr))]));
      varRows.push([t.n,fmt(lt.varGCA,4),fmt(lt.varSCA,4),
        lt.ratio===null?'—':fmt(lt.ratio,3),fmt(lt.varA,4),fmt(lt.varD,4),
        lt.degreeDominance===null?'—':fmt(lt.degreeDominance,3),
        lt.h2n===null?'—':fmt(lt.h2n,3),lt.h2b===null?'—':fmt(lt.h2b,3),
        fmt(lt.contribLines,1),fmt(lt.contribTesters,1),fmt(lt.contribLT,1)]);
    });
    out.sections.push({id:'D1',title:'Line × Tester analysis',
      note:'Kempthorne (1957). Combining ability uses the crosses only. σ²A = 2σ²gca with inbred parents (F = 1), σ²D = σ²sca.',
      tables:[
        tbl('D1_LT_ANOVA','Line × Tester ANOVA',
          ['Trait','Source','df','SS','MS','F','p','Sig.','Significance'],anovaRows),
        tbl('D1_GCA_lines','GCA effects of lines',
          ['Trait','Line','GCA effect','SE','t','Sig.'],gcaL),
        tbl('D1_GCA_testers','GCA effects of testers',
          ['Trait','Tester','GCA effect','SE','t','Sig.'],gcaT),
        tbl('D1_SCA_crosses','SCA effects of crosses',
          ['Trait','Line','Tester','Cross mean','SCA effect','SE','Sig.'],scaRows),
        tbl('D1_Variance','Combining ability variance',
          ['Trait','σ²gca','σ²sca','σ²gca/σ²sca','σ²A','σ²D','Degree of dominance','h² narrow','h² broad',
           'Lines contribution (%)','Testers (%)','L×T (%)'],varRows)]});
  }
  return out;
}

/* ============================================================
   FIGURES (SVG strings)
   ============================================================ */
const PAL={leaf:'#38872C',bright:'#6CC24A',seed:'#7A4A12',ink:'#1A231C',line:'#DCE8D6',mut:'#4C5A4F'};
function svgWrap(w,h,inner){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"
    font-family="IBM Plex Sans, Arial, sans-serif"><rect width="${w}" height="${h}" fill="#fff"/>${inner}</svg>`;
}
function figScree(res){
  const W=560,H=330,pad=52, cs=res.comps.slice(0,8), max=Math.max(...cs.map(c=>c.pct));
  const bw=(W-2*pad)/cs.length;
  let s=`<text x="${W/2}" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="${PAL.ink}">Scree plot</text>`;
  s+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="${PAL.line}"/>`;
  s+=`<line x1="${pad}" y1="${pad-10}" x2="${pad}" y2="${H-pad}" stroke="${PAL.line}"/>`;
  cs.forEach((c,i)=>{
    const h=(c.pct/max)*(H-pad-pad+6), x=pad+i*bw+bw*0.2, y=H-pad-h;
    s+=`<rect x="${x}" y="${y}" width="${bw*0.6}" height="${h}" fill="${i<2?PAL.leaf:PAL.bright}" rx="2"/>`;
    s+=`<text x="${x+bw*0.3}" y="${y-5}" text-anchor="middle" font-size="9" fill="${PAL.mut}">${c.pct.toFixed(1)}%</text>`;
    s+=`<text x="${x+bw*0.3}" y="${H-pad+14}" text-anchor="middle" font-size="10" fill="${PAL.mut}">PC${c.pc}</text>`;
  });
  s+=`<text x="16" y="${H/2}" transform="rotate(-90 16 ${H/2})" text-anchor="middle" font-size="10" fill="${PAL.mut}">Variance explained (%)</text>`;
  return svgWrap(W,H,s);
}
function figBiplot(res){
  const W=600,H=480,pad=50;
  const sx=res.scores.map(s=>s.x),sy=res.scores.map(s=>s.y);
  const lx=res.loadings.map(l=>l.x),ly=res.loadings.map(l=>l.y);
  const sMax=Math.max(...sx.map(Math.abs),...sy.map(Math.abs),1e-3);
  const lMax=Math.max(...lx.map(Math.abs),...ly.map(Math.abs),1e-3);
  const k=sMax/lMax*0.85;
  const m=Math.max(...[...sx,...sy,...lx.map(v=>v*k),...ly.map(v=>v*k)].map(Math.abs))*1.15;
  const X=v=>pad+((v+m)/(2*m))*(W-2*pad), Y=v=>H-pad-((v+m)/(2*m))*(H-2*pad);
  let s=`<text x="${W/2}" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="${PAL.ink}">PCA biplot</text>`;
  s+=`<rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="#FCFDFB" stroke="${PAL.line}"/>`;
  s+=`<line x1="${pad}" y1="${Y(0)}" x2="${W-pad}" y2="${Y(0)}" stroke="${PAL.line}" stroke-dasharray="3 3"/>`;
  s+=`<line x1="${X(0)}" y1="${pad}" x2="${X(0)}" y2="${H-pad}" stroke="${PAL.line}" stroke-dasharray="3 3"/>`;
  res.loadings.forEach(l=>{
    s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(l.x*k)}" y2="${Y(l.y*k)}" stroke="${PAL.seed}" stroke-width="1" opacity="0.55"/>`;
    s+=`<text x="${X(l.x*k)}" y="${Y(l.y*k)-4}" font-size="8.5" fill="${PAL.seed}" text-anchor="middle">${esc(String(l.name).slice(0,18))}</text>`;});
  res.scores.forEach(p2=>{
    s+=`<circle cx="${X(p2.x)}" cy="${Y(p2.y)}" r="4.5" fill="${PAL.leaf}" stroke="#fff" stroke-width="1.2"/>`;
    s+=`<text x="${X(p2.x)+7}" y="${Y(p2.y)+3.5}" font-size="10" fill="${PAL.ink}">${esc(p2.label)}</text>`;});
  s+=`<text x="${W/2}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="${PAL.mut}">PC1 — ${res.comps[0].pct.toFixed(1)}%</text>`;
  s+=`<text x="14" y="${H/2}" transform="rotate(-90 14 ${H/2})" text-anchor="middle" font-size="10.5" fill="${PAL.mut}">PC2 — ${(res.comps[1]?res.comps[1].pct:0).toFixed(1)}%</text>`;
  return svgWrap(W,H,s);
}
function figHeat(names,R){
  const n=names.length, cell=Math.max(16,Math.min(30,420/n));
  const left=150, top=130, W=left+n*cell+30, H=top+n*cell+30;
  let s=`<text x="${W/2}" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="${PAL.ink}">Correlation heatmap</text>`;
  names.forEach((nm,i)=>{
    s+=`<text x="${left-6}" y="${top+i*cell+cell*0.7}" text-anchor="end" font-size="9" fill="${PAL.mut}">${esc(nm.slice(0,22))}</text>`;
    s+=`<text x="${left+i*cell+cell*0.65}" y="${top-6}" font-size="9" fill="${PAL.mut}" transform="rotate(-60 ${left+i*cell+cell*0.65} ${top-6})">${esc(nm.slice(0,22))}</text>`;});
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const r=R[i][j];
    const col=r===null?'#F2F6F0':r>0
      ?`rgb(${Math.round(255-167*Math.abs(r))},${Math.round(255-120*Math.abs(r))},${Math.round(255-211*Math.abs(r))})`
      :`rgb(${Math.round(255-133*Math.abs(r))},${Math.round(255-181*Math.abs(r))},${Math.round(255-237*Math.abs(r))})`;
    s+=`<rect x="${left+j*cell}" y="${top+i*cell}" width="${cell-1}" height="${cell-1}" fill="${col}"/>`;
    if(n<=14&&r!==null) s+=`<text x="${left+j*cell+cell/2}" y="${top+i*cell+cell*0.66}" text-anchor="middle"
      font-size="8" fill="${Math.abs(r)>0.6?'#fff':PAL.ink}">${r.toFixed(2)}</text>`;
  }
  return svgWrap(W,H,s);
}
function figDendro(cl,labels,title){
  const n=labels.length, W=620, rowH=26, H=90+n*rowH;
  const maxH=cl.root.height||1, left=140, right=W-40;
  const order=[]; (function walk(nd){ if(!nd.children){order.push(nd.members[0]);return;}
    walk(nd.children[0]); walk(nd.children[1]); })(cl.root);
  const ypos={}; order.forEach((m,i)=>ypos[m]=70+i*rowH);
  const X=h=>right-(h/maxH)*(right-left);
  let s=`<text x="${W/2}" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="${PAL.ink}">${esc(title)}</text>`;
  function draw(nd){
    if(!nd.children){const m=nd.members[0];
      s+=`<text x="${right+6}" y="${ypos[m]+4}" font-size="10" fill="${PAL.ink}">${esc(labels[m])}</text>`;
      return {y:ypos[m],x:right};}
    const a=draw(nd.children[0]), b=draw(nd.children[1]);
    const x=X(nd.height), y=(a.y+b.y)/2;
    s+=`<path d="M${a.x} ${a.y} H${x} V${b.y} H${b.x}" fill="none" stroke="${PAL.leaf}" stroke-width="1.4"/>`;
    return {y,x};
  }
  draw(cl.root);
  s+=`<line x1="${left}" y1="${H-40}" x2="${right}" y2="${H-40}" stroke="${PAL.line}"/>`;
  for(let i=0;i<=4;i++){const h=maxH*i/4, x=X(h);
    s+=`<line x1="${x}" y1="${H-44}" x2="${x}" y2="${H-36}" stroke="${PAL.line}"/>
        <text x="${x}" y="${H-24}" text-anchor="middle" font-size="9" fill="${PAL.mut}">${h.toFixed(1)}</text>`;}
  s+=`<text x="${(left+right)/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${PAL.mut}">Distance</text>`;
  return svgWrap(W,H,s);
}
function figBars(title,labels,values,xlabel){
  const n=labels.length, rowH=22, W=600, H=70+n*rowH+30;
  const left=200, right=W-70, max=Math.max(...values,1e-6);
  let s=`<text x="${W/2}" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="${PAL.ink}">${esc(title)}</text>`;
  labels.forEach((l,i)=>{
    const y=56+i*rowH, w=(values[i]/max)*(right-left);
    s+=`<text x="${left-8}" y="${y+12}" text-anchor="end" font-size="10" fill="${PAL.mut}">${esc(String(l).slice(0,30))}</text>`;
    s+=`<rect x="${left}" y="${y+3}" width="${Math.max(1,w)}" height="13" fill="${PAL.bright}" rx="2"/>`;
    s+=`<text x="${left+w+6}" y="${y+14}" font-size="9" fill="${PAL.mut}">${values[i].toFixed(3)}</text>`;});
  s+=`<text x="${(left+right)/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="${PAL.mut}">${esc(xlabel)}</text>`;
  return svgWrap(W,H,s);
}
function figPath(pa){
  const n=pa.names.length, W=620, H=90+n*34;
  let s=`<text x="${W/2}" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="${PAL.ink}">Path diagram — direct effects</text>`;
  const cx=460, cy=H/2;
  s+=`<circle cx="${cx}" cy="${cy}" r="34" fill="${PAL.leaf}"/><text x="${cx}" y="${cy+4}" text-anchor="middle"
     font-size="11" fill="#fff">Dependent</text>`;
  pa.names.forEach((nm,i)=>{
    const y=60+i*34;
    s+=`<text x="150" y="${y+4}" text-anchor="end" font-size="10" fill="${PAL.ink}">${esc(String(nm).slice(0,26))}</text>`;
    const w=Math.min(6,Math.max(0.8,Math.abs(pa.direct[i])*6));
    s+=`<line x1="156" y1="${y}" x2="${cx-36}" y2="${cy}" stroke="${pa.direct[i]>=0?PAL.leaf:PAL.seed}"
        stroke-width="${w}" opacity="0.75"/>`;
    s+=`<text x="${(156+cx-36)/2}" y="${(y+cy)/2-3}" font-size="9" fill="${PAL.mut}">${pa.direct[i].toFixed(3)}</text>`;});
  s+=`<text x="${W/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="${PAL.mut}">Residual ${pa.residual.toFixed(3)} · R² ${pa.R2.toFixed(3)}</text>`;
  return svgWrap(W,H,s);
}
function buildFigures(p,R){
  const figs=[];
  if(R.pca){ figs.push({name:'scree_plot',svg:figScree(R.pca.res)});
             figs.push({name:'pca_biplot',svg:figBiplot(R.pca.res)}); }
  const a4=R.sections.find(s2=>s2.id==='A4');
  if(a4&&a4.heat) figs.push({name:'correlation_heatmap',svg:figHeat(a4.heat.names,a4.heat.R)});
  if(R.dendroQ) figs.push({name:'dendrogram_quantitative',svg:figDendro(R.dendroQ.cl,R.dendroQ.labels,'UPGMA dendrogram — quantitative')});
  if(R.dendroL) figs.push({name:'dendrogram_qualitative',svg:figDendro(R.dendroL.cl,R.dendroL.labels,'UPGMA dendrogram — qualitative')});
  if(R.shannon) figs.push({name:'shannon_diversity',svg:figBars('Shannon diversity by descriptor',
      R.shannon.map(r=>r[0]),R.shannon.map(r=>+r[2]||0),"H'")});
  if(R.uniformity) figs.push({name:'line_uniformity',svg:figBars('Within-line uniformity',
      R.uniformity.map(x=>x.e.name),R.uniformity.map(x=>x.mean),"Mean within-line H' (lower is more uniform)")});
  const a6=R.sections.find(s2=>s2.id==='A6');
  if(a6&&a6.tables[0]) figs.push({name:'gcv_pcv',svg:figBars('PCV% by trait',
      a6.tables[0].rows.map(r=>r[0]),a6.tables[0].rows.map(r=>+r[7]||0),'PCV%')});
  if(a6&&a6.tables[0]) figs.push({name:'heritability_gam',svg:figBars('Genetic advance as % of mean',
      a6.tables[0].rows.map(r=>r[0]),a6.tables[0].rows.map(r=>+r[11]||0),'GAM%')});
  if(R.mca){ const m=R.mca;
    const sc=m.centro.map(c=>({label:c.code,x:c.Dim1||0,y:c.Dim2||0}));
    const ld=m.m.catCoords.map(c=>({name:c.state,x:c.Dim1||0,y:c.Dim2||0}));
    figs.push({name:'mca_biplot',svg:figBiplot({scores:sc,loadings:ld,
      comps:[{pct:m.m.comps[0].adjPct},{pct:m.m.comps[1]?m.m.comps[1].adjPct:0}]})}); }
  if(R.path) figs.push({name:'path_diagram',svg:figPath(R.path.pa)});
  return figs;
}

</script>
<script>

/* ============================================================
   ANALYSIS SCREEN
   ============================================================ */
function screenAnalysis(){
  const p=active();
  const traits=analysableQuant(p), quals=analysableQual(p);
  const groups=[...new Set(PROCS.map(x=>x.g))];
  const avail=x=>{
    if(x.needLT&&p.design!=='LT') return 'Needs the Line × Tester design';
    if(x.needPlants&&p.plants<2) return 'Needs more than one plant per plot';
    if(x.g==='Quantitative'&&!traits.length) return 'No quantitative trait has enough records yet';
    if(x.g==='Qualitative'&&!quals.length) return 'No descriptor has enough records yet';
    return null;
  };
  if(!VIEW.dep&&traits.length) VIEW.dep=traits[traits.length-1].k;
  return `<div class="page page-wide">
    <div class="page-head"><div>
      <h1 class="t-title">Analysis</h1>
      <p class="t-small" style="margin-top:2px">Tick everything you need and run it once.
      ${traits.length} quantitative traits and ${quals.length} descriptors are ready.</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" data-act="sel-all">Select all available</button>
        <button class="btn btn-sm" data-act="sel-none">Clear</button>
        <button class="btn btn-primary" data-act="run" ${VIEW.sel.size?'':'disabled'}>${icon('play')}Run ${VIEW.sel.size||''} analyses</button>
      </div></div><div class="hr"></div>
    <div class="grid-2" style="align-items:start;gap:20px">
      ${groups.map(g=>`<div class="card card-pad">
        <h3 class="t-h" style="margin-bottom:10px">${g}</h3>
        <div style="display:flex;flex-direction:column;gap:2px">
        ${PROCS.filter(x=>x.g===g).map(x=>{const why=avail(x);
          return `<button class="procrow" data-act="proc" data-id="${x.id}" ${why?'disabled':''}
            aria-pressed="${VIEW.sel.has(x.id)}" title="${why?esc(why):''}">
            <span class="cbox" data-s="${VIEW.sel.has(x.id)?'all':'none'}"></span>
            <span style="flex:1"><strong>${x.n}</strong><span class="t-meta" style="display:block">${why||x.d}</span></span>
          </button>`;}).join('')}
        </div>
        ${g==='Quantitative'?`<div class="field" style="margin-top:12px">
          <label class="label">Dependent trait for path analysis</label>
          <select class="select" data-act="dep">
            ${traits.map(t=>`<option value="${t.k}" ${VIEW.dep===t.k?'selected':''}>${esc(t.n)}</option>`).join('')}
          </select></div>`:''}
      </div>`).join('')}
    </div>
    ${VIEW.results?renderResults(VIEW.results):''}
  </div>`;
}
function renderResults(R){
  const figs=R.figs||[];
  return `<div class="hr"></div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <h2 class="t-title">Results</h2>
    <span class="pill pill-leaf">${R.sections.length} procedures</span>
    ${R.meta.mono&&R.meta.mono.length?`<span class="pill pill-amber">${R.meta.mono.length} monomorphic descriptors excluded</span>`:''}
    <button class="btn btn-sm" style="margin-left:auto" data-act="go" data-screen="export">${icon('down',14)}Export workbook</button>
  </div>
  ${R.sections.map(s=>`
    <section class="sheet" style="margin-bottom:20px">
      <div class="sheet-head"><h3 class="t-h">${esc(s.title)}</h3>
        <span class="t-meta" style="margin-left:auto">${esc(s.note||'')}</span></div>
      ${(s.tables||[]).map(t=>`
        <div class="sheet-body" style="padding:0">
          <div style="padding:10px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center">
            <strong class="t-sh">${esc(t.title)}</strong>
            <span class="num t-meta">${t.sheet}</span>
            <span class="t-meta" style="margin-left:auto">${t.rows.length} rows</span></div>
          <div class="scroll-x" style="max-height:420px"><table class="tbl">
            <thead><tr>${t.cols.map((c,i)=>`<th class="${i?'num':'sticky-col'}">${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${t.rows.slice(0,200).map(r=>`<tr>${r.map((v,i)=>{
              const sv=String(v??'');
              const cls=i?'num':'sticky-col';
              const col=sv==='Significant'?'color:var(--leaf);font-weight:500':
                        sv==='Non-significant'?'color:var(--ink-3)':
                        (sv==='**'||sv==='*')?'color:var(--leaf);font-weight:600':'';
              return `<td class="${cls}" style="${col}">${esc(sv)}</td>`;}).join('')}</tr>`).join('')}
            </tbody></table></div>
          ${t.rows.length>200?`<div class="t-meta" style="padding:8px 16px">Showing the first 200 rows. The workbook contains all ${t.rows.length}.</div>`:''}
        </div>`).join('')}
      ${figs.filter(f=>(s.figures||[]).some(n=>f.name.includes(n.replace('dendroQ','dendrogram_quantitative')
        .replace('dendroL','dendrogram_qualitative').replace('scree','scree').replace('biplot','biplot')
        .replace('mca','mca').replace('path','path').replace('shannon','shannon').replace('uniformity','uniformity'))))
        .map(f=>`<div class="sheet-body" style="border-top:1px solid var(--line-2)">${f.svg}</div>`).join('')}
    </section>`).join('')}`;
}

/* ============================================================
   EXPORT
   ============================================================ */
function dataSheets(p){
  const out=[];
  const quals=scopedQual(p), quants=scopedQuant(p);
  const head=t=>t.n+(codeOf(p,t)?' ('+codeOf(p,t)+')':'')+(t.u?' ['+t.u+']':'');
  if(quals.length){
    const rows=[];
    p.entries.forEach((e,ei)=>{for(let r=1;r<=p.reps;r++)for(let pl=1;pl<=p.plants;pl++){
      const c=cell(p,e.id,r,pl);
      rows.push([ei+1,e.name,r,pl,...quals.map(t=>c.qual[t.k]??'')]);}});
    out.push(tbl('Data_Qual_PlantLevel','Qualitative data, plant level',
      ['VAR','Genotype','Replication','Plant#',...quals.map(t=>t.n)],rows));
  }
  if(quants.length){
    const rows=[];
    p.entries.forEach((e,ei)=>{for(let r=1;r<=p.reps;r++)for(let pl=1;pl<=p.plants;pl++){
      const c=cell(p,e.id,r,pl);
      rows.push([ei+1,e.name,r,pl,...quants.map(t=>{const v=c.quant[t.k];return filled(v)?+v:'';})]);}});
    out.push(tbl('Data_Quant_PlantLevel','Quantitative data, plant level',
      ['VAR','Genotype','Replication','Plant#',...quants.map(head)],rows));
    const pm=[];
    p.entries.forEach((e,ei)=>{for(let r=1;r<=p.reps;r++){
      pm.push([e.name,ei+1,r,...quants.map(t=>{const m=plotMean(p,e.id,r,t.k);return m===null?'':+m.toFixed(4);})]);}});
    out.push(tbl('Data_Plot_Means','Plot means (mean of plants in each replication)',
      ['Line','VAR','REP',...quants.map(head)],pm));
    out.push(tbl('Data_Genotype_Means','Genotype means (mean over replications)',
      ['Line',...quants.map(head)],
      p.entries.map(e=>[e.name,...quants.map(t=>{const m=entryMean(p,e.id,t.k);return m===null?'':+m.toFixed(4);})])));
  }
  return out;
}
function meanSquaresSheet(p){
  const design=p.design==='LT'?'RCBD':p.design;
  const rows=[];
  analysableQuant(p).forEach(t=>{
    const a=S.anova(obs(p,t.k),design); if(!a||a.insufficient)return;
    a.table.forEach(r=>rows.push([t.n,codeOf(p,t),r.src,r.df,
      +r.ss.toFixed(4), r.ms!==undefined?+r.ms.toFixed(4):'',
      r.F!==undefined&&r.F!==null?+r.F.toFixed(3):'',
      r.p!==undefined?+r.p.toFixed(5):'', r.p!==undefined?stars(r.p):'',
      r.p!==undefined?sigWord(r.p):'']));
  });
  return tbl('Mean_Squares','Mean squares',
    ['Trait','Code','Source','df','SS','MS','F','p','Sig.','Significance'],rows);
}
function headerRows(p){
  return [[p.name],['Crop',p.crop],['Design',DESIGN_NAME[p.design],'Replications',p.reps,'Plants per plot',p.plants],
    ['Location',p.site||'','Season',p.season||'','Investigator',p.investigator||''],
    ['Exported',new Date().toLocaleString()],[]];
}
async function exportWorkbook(){
  const p=active();
  if(typeof XLSX==='undefined'){toast('Spreadsheet library did not load');return;}
  const R=VIEW.results;
  const sheets=[...dataSheets(p), meanSquaresSheet(p),
    ...(R?R.sections.flatMap(s=>s.tables||[]):[])];
  const wb=XLSX.utils.book_new();
  const used=new Set();
  sheets.forEach(t=>{
    let name=(t.sheet||'Sheet').slice(0,31);
    let i=2; while(used.has(name)){name=(t.sheet.slice(0,28)+'_'+i).slice(0,31);i++;}
    used.add(name);
    const aoa=[...(t.sheet.startsWith('Data_')?headerRows(p):[[t.title],[]]),t.cols,...t.rows];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=t.cols.map((c,i2)=>({wch:Math.max(10,Math.min(34,
      Math.max(String(c).length+2,...t.rows.slice(0,80).map(r=>String(r[i2]??'').length+2))))}));
    XLSX.utils.book_append_sheet(wb,ws,name);
  });
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  await save(`${slug(p.name)}_supplementary.xlsx`, new Blob([buf],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function svgToPng(svg,scale=2){
  return new Promise(res=>{
    const m=svg.match(/viewBox="0 0 (\d+) (\d+)"/);
    const w=m?+m[1]:600, h=m?+m[2]:400;
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>res(b),'image/png');
    };
    img.onerror=()=>res(null);
    img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
  });
}
async function exportFigures(){
  const p=active();
  if(!VIEW.results||!VIEW.results.figs||!VIEW.results.figs.length){toast('Run an analysis first');return;}
  if(typeof JSZip==='undefined'){toast('Zip library did not load');return;}
  const zip=new JSZip();
  for(const f of VIEW.results.figs){
    zip.file(f.name+'.svg',f.svg);
    const png=await svgToPng(f.svg,2);
    if(png) zip.file(f.name+'.png',png);
  }
  const blob=await zip.generateAsync({type:'blob'});
  await save(`${slug(p.name)}_figures.zip`,blob);
}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,46);
async function save(filename,blob){
  try{
    const dl=window.claude&&await window.claude.use('downloads');
    if(dl){ await dl.save({filename,data:blob}); toast('Saved '+filename); return; }
  }catch(e){ if(e&&e.code==='declined'){return;} }
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},600);
    toast('Downloaded '+filename);
  }catch(e){ toast('The browser blocked the download'); }
}

function scrollTop(){const m=$('.main'); if(m){m.scrollTo?m.scrollTo({top:0}):m.scrollTop=0;}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act, p=active();
  if(act==='new'){openWizard();return;}
  if(act==='example'){ seedExample(); if(VIEW.screen==='home'){render();toast('Example trial loaded');} return; }
  if(act==='home'){DB.activeId=null;VIEW.screen='home';VIEW.results=null;editSel=null;persist();render();return;}
  if(act==='open'){DB.activeId=b.dataset.id;VIEW.screen='overview';VIEW.entry=null;VIEW.rep=1;
    VIEW.results=null;editSel=null;persist();render();return;}
  if(act==='del'){
    const id=b.dataset.id, pr=DB.projects.find(x=>x.id===id); if(!pr)return;
    confirmDialog('Delete this trial?',
      `${pr.name} and all ${pr.entries.length*pr.reps*pr.plants} plant records will be removed. This cannot be undone.`,
      'Delete trial',()=>{ DB.projects=DB.projects.filter(x=>x.id!==id);
        if(DB.activeId===id){DB.activeId=null;VIEW.screen='home';}
        try{localStorage.setItem('cottonbook.seeded','1');}catch(e2){}
        persist();render();toast('Trial deleted'); });
    return;}
  if(act==='go'){VIEW.screen=b.dataset.screen; if(b.dataset.screen==='traits')editSel=null; render();scrollTop();return;}
  if(act==='jump'){VIEW.entry=b.dataset.e;VIEW.rep=+b.dataset.r;VIEW.screen='record';render();return;}
  if(act==='tab'){VIEW.tab=b.dataset.v;render();return;}
  if(act==='ttab'){traitTab=b.dataset.v;render();return;}
  if(act==='pick-r'){VIEW.rep=+b.dataset.v;render();return;}
  if(act==='prev-entry'||act==='next-entry'){
    const i=p.entries.findIndex(x=>x.id===VIEW.entry);
    const n=act==='next-entry'?i+1:i-1;
    if(n>=0&&n<p.entries.length){VIEW.entry=p.entries[n].id;render();scrollTop();}
    return;}
  if(act==='copy-rep'){
    const src=VIEW.rep-1;
    for(let pl=1;pl<=p.plants;pl++){
      const a=cell(p,VIEW.entry,src,pl), c=cell(p,VIEW.entry,VIEW.rep,pl);
      c.quant={...a.quant}; c.qual={...c.qual,...a.qual};
    }
    persist();render();toast('Copied R'+src+' into R'+VIEW.rep);return;}
  if(act==='fill-row'){
    const first=$('#gridbody .ginp, #gridbody .gsel');
    if(!first){toast('Nothing to fill');return;}
    $$('#gridbody tr').forEach(tr=>{
      const cs=tr.querySelectorAll('.ginp,.gsel');
      if(!cs.length)return;
      const v=cs[0].value; if(!v)return;
      cs.forEach((c,i)=>{if(i)writeCell(c,v);});
    });
    persist();refreshDerived();toast('Filled across');return;}
  if(act==='apply-scope'){
    p.traits.qual=[...editSel.Q]; p.traits.quant=[...editSel.M];
    persist();editSel=null;render();toast('Sheet updated');return;}
  if(act==='reset-scope'){editSel=null;render();return;}
  if(act==='proc'){
    const id=b.dataset.id;
    VIEW.sel.has(id)?VIEW.sel.delete(id):VIEW.sel.add(id);
    render();return;}
  if(act==='sel-all'){
    PROCS.forEach(x=>{
      if(x.needLT&&p.design!=='LT')return;
      if(x.needPlants&&p.plants<2)return;
      if(x.g==='Quantitative'&&!analysableQuant(p).length)return;
      if(x.g==='Qualitative'&&!analysableQual(p).length)return;
      VIEW.sel.add(x.id);});
    render();return;}
  if(act==='sel-none'){VIEW.sel.clear();VIEW.results=null;render();return;}
  if(act==='run'){
    b.disabled=true; b.textContent='Running…';
    setTimeout(()=>{
      try{
        const R=runAnalysis(p,VIEW.sel,VIEW.dep);
        R.figs=buildFigures(p,R);
        VIEW.results=R; render();
        const el=$$('.sheet')[0]; if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});
        toast(`${R.sections.length} analyses complete`);
      }catch(err){ console.error(err); toast('Analysis failed: '+err.message); render(); }
    },30);
    return;}
  if(act==='cbk-save'){exportTrialFile();return;}
  if(act==='cbk-open'){openTrialFile();return;}
  if(act==='cbk-all'){exportLibrary();return;}
  if(act==='xlsx'){exportWorkbook();return;}
  if(act==='zip'){exportFigures();return;}
  if(pickerClick(b,editSel?editSel.Q:new Set(),editSel?editSel.M:new Set(),p)){render();return;}
});

        const within=Math.sin(gi*1.3+r*2.6+pl*4.1)*0.030+Math.cos(pl*2.2+gi)*0.018;
        const v=base[k][gi]*(1+plot+within);
        c.quant[k]=(t.dp===0?Math.round(v):v).toFixed(t.dp??2);
      });
      QUAL.forEach(k=>{
        let v=qual[k][gi];
        const off=offType[gi];
        if(off&&off[k]&&pl===p.plants&&r===1) v=off[k];
        c.qual[k]=v;
      });
    }
  });
  persist();
}

/* ---------------- boot ---------------- */
load();
// the app always starts empty; the example trial loads only when asked for
DB.activeId=null; VIEW.screen='home';
render(); saveState='saved'; saveAt=new Date(); paintSave();

</script>
