name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to attach the APK to'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

env:
  APP_DIR: cottonbook-software/mobile

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack the Android project
        run: |
          # use the most recently uploaded mobile zip, whatever the browser called it
          shopt -s nullglob
          best=""; bestt=0
          for f in mobile*.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -gt "$bestt" ]; then best="$f"; bestt=$t; fi
          done
          test -n "$best" || { echo "No mobile zip found. Upload it to the top level."; exit 1; }
          echo "Using the most recently uploaded zip: $best"
          mkdir -p cottonbook-software
          unzip -oq "$best" -d cottonbook-software
          ls "$APP_DIR"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Create the Android project
        working-directory: ${{ env.APP_DIR }}
        env:
          APP_VERSION_NAME: '1.0.1'
          APP_VERSION_CODE: '2'
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk" CottonBook_1.0.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CottonBook-apk
          path: CottonBook_1.0.1.apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" CottonBook_1.0.1.apk --clobber --repo "${{ github.repository }}"
