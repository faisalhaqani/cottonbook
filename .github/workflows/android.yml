name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to attach the APK to'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  APP_DIR: cottonbook-software/mobile

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack the Android project
        run: |
          test -f mobile.zip || { echo "mobile.zip is not in the repository. Upload it to the top level."; exit 1; }
          mkdir -p cottonbook-software
          unzip -oq mobile.zip -d cottonbook-software
          ls "$APP_DIR"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Create the Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk" CottonBook_1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CottonBook-apk
          path: CottonBook_1.0.0.apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" CottonBook_1.0.0.apk --clobber --repo "${{ github.repository }}"
